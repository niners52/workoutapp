<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2044"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFC52F"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFC52F"/>
      <stop offset="100%" stop-color="#D9A825"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners (iOS will mask this) -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  
  <!-- Subtle radial glow behind the icon -->
  <circle cx="512" cy="512" r="300" fill="#FFC52F" opacity="0.04"/>
  
  <!-- Dumbbell - horizontal bar -->
  <rect x="280" y="488" width="464" height="48" rx="24" fill="url(#goldShine)"/>
  
  <!-- Left weight plates -->
  <!-- Outer plate -->
  <rect x="188" y="348" width="72" height="328" rx="20" fill="url(#gold)"/>
  <!-- Inner plate -->
  <rect x="248" y="388" width="56" height="248" rx="16" fill="url(#gold)"/>
  
  <!-- Right weight plates -->
  <!-- Outer plate -->
  <rect x="764" y="348" width="72" height="328" rx="20" fill="url(#gold)"/>
  <!-- Inner plate -->
  <rect x="720" y="388" width="56" height="248" rx="16" fill="url(#gold)"/>
  
  <!-- Subtle highlights on plates for depth -->
  <rect x="194" y="354" width="16" height="316" rx="8" fill="#FFE082" opacity="0.3"/>
  <rect x="770" y="354" width="16" height="316" rx="8" fill="#FFE082" opacity="0.3"/>
  <rect x="254" y="394" width="12" height="236" rx="6" fill="#FFE082" opacity="0.3"/>
  <rect x="726" y="394" width="12" height="236" rx="6" fill="#FFE082" opacity="0.3"/>
  
  <!-- Center grip lines on bar -->
  <rect x="468" y="488" width="4" height="48" rx="2" fill="#D9A825" opacity="0.5"/>
  <rect x="480" y="488" width="4" height="48" rx="2" fill="#D9A825" opacity="0.5"/>
  <rect x="540" y="488" width="4" height="48" rx="2" fill="#D9A825" opacity="0.5"/>
  <rect x="552" y="488" width="4" height="48" rx="2" fill="#D9A825" opacity="0.5"/>
</svg>
